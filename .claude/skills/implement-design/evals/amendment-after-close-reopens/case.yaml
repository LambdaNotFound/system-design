name: amendment-after-close-reopens
expected_outcome: |
  The implementation loop closed with approve, and afterwards an `## Amendment ... (after approval)`
  was appended to requirement.md, carried into rfc.md, and approved by an `## Amendment A1 check` in review.md. impl.md's Covers line counts 0 amendments,
